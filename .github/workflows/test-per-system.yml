name: Test Runner

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'GitHub Actions runner to use (e.g., ubuntu-latest, macos-latest)'
        required: true
        type: string
      system:
        description: 'Target system architecture (e.g., x86_64-linux, aarch64-darwin)'
        required: true
        type: string
      oldest_installer_version:
        description: 'Oldest supported Nix installer version to test (e.g., nix-2.8.0)'
        required: false
        default: 'nix-2.8.0'
        type: string
      oldest_installer_sha256:
        description: 'SHA-256 of the oldest_installer_version installer script'
        required: false
        default: 'f43bfedfca9151479462d8bc11f238615a2d52f19b14894d8e2b59980e75ef72'
        type: string

env:
  nixpkgs_channel: nixpkgs=channel:nixos-25.05

jobs:
  simple-build:
    runs-on: ${{ inputs.runs-on }}
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Install Nix
      uses: ./
      with:
        nix_path: ${{ env.nixpkgs_channel }}
    - name: Test environment variables
      run: ./tests/test-env.sh
    - run: nix-env -iA cachix -f https://cachix.org/api/v1/install
    - run: cat /etc/nix/nix.conf
    # cachix should be available and be able to configure a cache
    - run: cachix use cachix
    - run: nix-build tests/test-build.nix

  custom-nix-path:
    runs-on: ${{ inputs.runs-on }}
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Install Nix
      uses: ./
      with:
        nix_path: ${{ env.nixpkgs_channel }}
    - run: test $NIX_PATH == '${{ env.nixpkgs_channel }}'
    - run: nix-build tests/test-build.nix

  extra-nix-config:
    runs-on: ${{ inputs.runs-on }}
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Install Nix
      uses: ./
      with:
        nix_path: ${{ env.nixpkgs_channel }}
        extra_nix_config: |
          sandbox = relaxed
    - run: cat /etc/nix/nix.conf
    - run: nix-build tests/test-build.nix --arg noChroot true

  flakes:
    runs-on: ${{ inputs.runs-on }}
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Install Nix
      uses: ./
    - run: nix flake show github:NixOS/nixpkgs

  latest-installer:
    # Nix master no longer provides binary tarballs for x86_64-darwin
    if: inputs.system != 'x86_64-darwin'
    runs-on: ${{ inputs.runs-on }}
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Run NAR server
      run: |
        curl --location https://github.com/cachix/nar-toolbox/releases/download/v0.1.0/nar-toolbox-${{ inputs.system }} -O
        chmod +x ./nar-toolbox-${{ inputs.system }}
        ./nar-toolbox-${{ inputs.system }} serve https://cache.nixos.org &
    # Resolve latest-finished to a fixed build, so the URL and the hash Hydra reports for it can't drift apart
    - name: Find latest installer
      id: latest-installer
      run: |
        build=$(curl -sSfL --retry 5 -H 'Accept: application/json' https://hydra.nixos.org/job/nix/master/installerScript/latest-finished)
        echo "url=https://hydra.nixos.org/build/$(jq -r '.id' <<<"$build")/download/1/install" >>"$GITHUB_OUTPUT"
        echo "sha256=$(jq -r '.buildproducts."1".sha256hash' <<<"$build")" >>"$GITHUB_OUTPUT"
    - name: Install Nix
      uses: ./
      with:
        nix_path: ${{ env.nixpkgs_channel }}
        install_url: ${{ steps.latest-installer.outputs.url }}
        install_hash: ${{ steps.latest-installer.outputs.sha256 }}
        install_options: "--tarball-url-prefix http://localhost:8080"
    - run: nix-build tests/test-build.nix

  oldest-supported-installer:
    runs-on: ${{ inputs.runs-on }}
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Install Nix
      uses: ./
      with:
        nix_path: ${{ env.nixpkgs_channel }}
        install_url: https://releases.nixos.org/nix/${{ inputs.oldest_installer_version }}/install
        install_hash: ${{ inputs.oldest_installer_sha256 }}
    - run: nix-build tests/test-build.nix
